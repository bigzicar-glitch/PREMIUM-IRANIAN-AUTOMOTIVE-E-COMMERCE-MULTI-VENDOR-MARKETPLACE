version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: autopart
      POSTGRES_USER: autopart
      POSTGRES_PASSWORD: autopart_dev_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopart -d autopart"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./:/app
      - backend_node_modules:/app/backend/node_modules
    environment:
      - DATABASE_URL=postgresql://autopart:autopart_dev_2024@db:5432/autopart
      - PORT=4000
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "apt-get update -y -qq && apt-get install -y -qq openssl ca-certificates > /dev/null 2>&1; npm install && npx prisma generate && npx prisma db push --accept-data-loss && node src/seed.js && exec node src/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: node:22-slim
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      - VITE_API_URL=http://backend:4000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
